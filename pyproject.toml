[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roomnav"
version = "0.1.0"
description = "RGB-first, human-in-the-loop, room-number and signage-guided indoor search research scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RoomNav contributors"}]
license = {text = "Proprietary - license not yet selected"}
dependencies = []

[project.optional-dependencies]
vision = ["rapidocr>=3.0", "onnxruntime>=1.17", "pillow>=10"]
ui = ["gradio==6.30.0"]
detection = [
    "ultralytics>=8.3", "numpy>=1.24",
    # YOLO-World set_classes() needs CLIP; Ultralytics leaves it optional.
    "clip @ https://codeload.github.com/ultralytics/CLIP/zip/7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
]
development = ["pytest>=8.0"]

[project.scripts]
roomnav-baseline = "roomnav.cli:main"
roomnav-llm = "roomnav.llm_cli:main"
roomnav-evaluate = "roomnav.eval_cli:main"
roomnav-stream = "roomnav.stream_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
